name: Link Checker

on:
  pull_request:
    types:
      [
        opened,
        edited,
        review_requested,
        synchronize,
        reopened,
        ready_for_review,
        labeled,
        unlabeled,
      ]

jobs:
  linkchecker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # lychee is a fast, asynchronous link checker which detects broken URLs and mail addresses in local files
      - name: lychee Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --accept=200,403,429  "**/*.html" "**/*.md" "**/*.txt" "**/*.json" --exclude "file:///github/workspace/*"
          fail: true # Fail workflow run on error (i.e. when lychee exit code is not 0)
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
